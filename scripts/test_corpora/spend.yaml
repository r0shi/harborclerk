# Cloud spend policy for the eval harness. ADR 0001, decision 6: spend is capped per benchmark run,
# enforced in code, with prices held in configuration. `runner/spend.py` reads this file; nothing else
# in the harness may construct a cloud client (tests/test_spend.py holds that).
#
# The cap can be lowered for one run (--spend-cap-usd, HC_EVAL_SPEND_CAP_USD). Raising it means editing
# this file, which means a PR.
cap_usd: 25.00

# USD per million tokens, list price, first-party API, global routing. A model that is not listed here
# cannot be called: a call that cannot be priced cannot be capped. Add the model, its price and the date
# you read it; do not guess.
prices:
  verified: "2026-09-21"
  sources:
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://developers.openai.com/api/docs/pricing
  models:
    # No long-context premium for Claude 4.6 and later. cache_write is the 1-hour rate, the dearer of the
    # two, because the usage block does not say which was used.
    claude-sonnet-4-6: {input: 3.00, output: 15.00, cache_write: 6.00, cache_read: 0.30}
    # Not used by default. Listed so that moving the judge is a one-line change. Claude 4.7 and later
    # tokenize the same text into about 30% more tokens, so a newer judge costs more per call than the
    # price ratio suggests, and its scores are not comparable with a Sonnet 4.6 judge's.
    claude-sonnet-5: {input: 2.00, output: 10.00, cache_write: 4.00, cache_read: 0.20}
    claude-opus-5: {input: 5.00, output: 25.00, cache_write: 10.00, cache_read: 0.50}
    claude-haiku-4-5: {input: 1.00, output: 5.00, cache_write: 2.00, cache_read: 0.10}
    # Cached input is billed at 1.25; the meter charges every prompt token at the full rate.
    gpt-4o: {input: 2.50, output: 10.00}
    # Read 2026-09-21 for the judge bake-off (#661). gpt-5.6-luna is the sweep's judge since 2026-09-22
    # (docs/reports/2026-09-22-rubric-test.md); the other two are priced to be callable, not endorsed. OpenAI
    # bills a cached prefix at a tenth of input on these; the meter charges every prompt token at the full rate.
    gpt-5.6-sol: {input: 4.00, output: 20.00}
    gpt-5.6-terra: {input: 2.00, output: 12.00}
    gpt-5.6-luna: {input: 0.20, output: 1.20}

# Before a call the meter reserves its worst case: the request's size in characters divided by this, at
# the input price, plus max_tokens at the output price. English runs near 4 characters per token; 2.5
# over-reserves on purpose, since the reservation is what stops a run before the cap, not after it.
chars_per_token: 2.5

# Tokens per unit of work, for the pre-run estimate that refuses to start a run over the cap. The estimate has
# to stop a run that is plainly too big; the per-call hard stop is the guard. Correct these from spend.json's
# by_kind: tokens divided by `units`, never by `calls`. An estimate is per unit of work, and a baseline question
# is a tool loop of several calls.
#
# baseline_question is MEASURED, on the bounded, cached loop (#682, MAX_MODEL_CALLS = 16): bench-20260922-2305
# on ix, CUAD, claude-sonnet-4-6, 16 questions, 83 calls, USD 7.98 (docs/reports/2026-09-23-benchmark-ix-
# bench-20260922-2305.md). Per question: 7 plain input tokens, 63,786 cache-write, 235,400 cache-read, 3,017
# out, USD 0.4986. Stated in input-token equivalents by the rule below: 151,119 in and 3,017 out, rounded up.
# The unbounded, uncached loop before it (bench-20260921-0041) was 375,859 in and 3,171 out per question, USD
# 18.80 for the same 16 (#682); the 20,000 and 1,500 guessed before anything was metered told the owner
# USD 2.64 for a run that cost 19.58. Three things about the figure:
#   - It is CUAD: long contracts, research-type questions of up to 16 calls. The other corpora have not been
#     metered, and an estimate that is right for CUAD is a ceiling for them, which is the safe side.
#   - The ledger prices a cache write at the one-hour rate while the code asks for five-minute breakpoints, so
#     usd overstates, and so does this: the safe side again.
#   - HOW TO CORRECT IT FROM A CACHED RUN. Not "input_tokens divided by units": with breakpoints on, the API's
#     input_tokens is only what came after the last breakpoint, close to nothing, and that rule would put a
#     few tokens here and rebuild the underestimate this replaced. An estimate holds input and output tokens
#     only, priced as plain input, so state the cost in input-token equivalents:
#         input_tokens = (usd / units - output_tokens / units * output price) / input price, per million
#     from the kind's row in spend.json (the report's Cloud spend table shows the same row).
# candidate_answer is what answer-eval and rerun_pr_j pay a cloud model per item. It was priced as a
# baseline_question until that became CUAD's measured figure, which refused answer-eval on the synthetic corpus
# outright (29 one-hop lookups at the price of 29 contract research questions). PROVISIONAL, not metered: the
# ten CUAD ask-type questions took 6.0 model calls on average against 12.2 for the six research-type ones, and
# a synthetic lookup should need fewer still. Correct it the same way from the first metered answer-eval.
# judge is measured too, bench-20260922-2305, gpt-5.6-luna: 53 units, 2,656 in and 656 out each (the rubric of
# #695 asks for more than the Sonnet 4.6 judge's 405). USD 0.0013 a verdict.
# The rest are still PROVISIONAL, from RUNBOOK.md's old cost table.
estimates:
  synthetic_doc: {input_tokens: 600, output_tokens: 1000}
  baseline_question: {input_tokens: 152000, output_tokens: 3100}
  candidate_answer: {input_tokens: 120000, output_tokens: 1500}
  judge: {input_tokens: 3000, output_tokens: 700}
  answer_judge: {input_tokens: 3000, output_tokens: 400}
  cross_judge: {input_tokens: 3000, output_tokens: 400}
