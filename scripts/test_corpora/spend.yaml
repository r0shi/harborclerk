# Cloud spend policy for the eval harness. ADR 0001, decision 6: spend is capped per benchmark run,
# enforced in code, with prices held in configuration. `runner/spend.py` reads this file; nothing else
# in the harness may construct a cloud client (tests/test_spend.py holds that).
#
# The cap can be lowered for one run (--spend-cap-usd, HC_EVAL_SPEND_CAP_USD). Raising it means editing
# this file, which means a PR.
#
# 25.00 until 2026-10-14. Raised to 35.00 by the owner for the frontier cloud-subject runs (#811): with thinking
# counted, Fable 5.1 on the 20 keyed CUAD questions estimated 24.11 and each call reserves its worst case on top,
# so a 25.00 cap stops that run around question 17; 35.00 lets the four planned runs (Fable 5.1 and gpt-6-astra
# on keyed CUAD and keyed synthetic) finish. Lower it per run for anything smaller.
cap_usd: 35.00

# USD per million tokens, list price, first-party API, global routing, standard context (no long-context premium
# applies at the sizes the harness sends: Claude 4.6 and later have none, OpenAI's starts at 272K input tokens
# in one request). A model that is not listed here cannot be called: a call that cannot be priced cannot be
# capped. Add the model, its price and the date you read it; do not guess.
#
# Keys. `input` and `output` are required. Anthropic bills a prompt-cache write by its lifetime, `cache_write_5m`
# (1.25x input) or `cache_write_1h` (2x), and a hit at `cache_read`; the meter reads which lifetime was used from
# the response's `usage.cache_creation` and, when a response does not say, prices every write at the hour rate,
# the dearer. OpenAI bills a cached prefix at `cached_input` and, on GPT-5.6 and later, a cache write at
# `cache_write` (1.25x input; one rate, the lifetime is the API's), both read from `usage.*_tokens_details`. A
# model with no cache price is charged the published multiplier on a write (1.25x, 2x) and plain input on a hit.
# `tokenizer`: tokens this model counts for text Sonnet 4.6 counts as one token (default 1.0). The estimates
# below were measured on Sonnet 4.6 and the pre-run estimate multiplies them by this. Claude 4.7 and later
# (Opus 5, Fable 5.1, Opus 5.5, Sonnet 5.5, Sonnet 5) tokenize about 30% more tokens for the same text, the
# pricing page says; OpenAI's tokenizers have not been measured against Sonnet 4.6, so their models keep 1.0 and
# are estimated at Sonnet's volumes.
# `thinking_output_tokens`: thinking the model bills as output on each call, over the visible answer, which the
# estimates below do not carry (Sonnet 4.6 thinks only when asked, and was not). Adaptive thinking is always on
# for Claude 4.7 and later (Fable 5.1 at effort high by default, Opus 5.5 at medium) and GPT-6 reasons on every
# call. The estimate adds it to each call of a unit (`calls_per_unit` below) as output, and, since Claude 4.6 and
# later keep prior turns' thinking blocks in context and GPT-6's reasoning items are passed back, as a cache
# write with the next call and a read on the calls after. MEASURED 2026-10-15 on the four cloud-subject runs:
# claude-fable-5-1 241 a call on keyed CUAD (20,768 over 86) and 148 on keyed synthetic (15,876 over 107);
# gpt-6-astra 18 (1,748 over 98) and 11 (1,110 over 99). The rows carry the larger figure rounded up: 250 for
# Fable, 25 for astra. The other Claude 4.7+ rows and the two GPT-6 sol rows are unmeasured and take their
# family's figure (PROVISIONAL; Opus 5.5 at effort medium may think less than Fable at high). Before this they
# were a guess of 1,500, which put Fable's CUAD estimate at 24.11 for a run that cost 21.46 and astra's synthetic
# at 25.78 for 8.16. Correct a row from its first metered run: spend.json's by_kind thinking_tokens / calls. The
# gpt-5.6 rows are 0 because the judge estimate was measured on gpt-5.6-luna with its reasoning already in the
# output figure.
prices:
  verified: "2026-10-14"
  sources:
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://developers.openai.com/api/docs/pricing
  models:
    # The sweep's default baseline (conftest.BASELINE_MODEL), and the model every estimate below was measured on.
    claude-sonnet-4-6: {input: 3.00, output: 15.00, cache_write_5m: 3.75, cache_write_1h: 6.00, cache_read: 0.30}
    # Cloud subjects: run through Harbor Clerk's MCP tools as the phase-1 baseline (--baseline-model) and scored
    # against the answer key. One model per run, one corpus per run, under the cap; the report has a row for it.
    claude-fable-5-1: {input: 10.00, output: 50.00, cache_write_5m: 12.50, cache_write_1h: 20.00, cache_read: 0.25, tokenizer: 1.3, thinking_output_tokens: 250}
    claude-opus-5-5: {input: 4.00, output: 20.00, cache_write_5m: 5.00, cache_write_1h: 8.00, cache_read: 0.20, tokenizer: 1.3, thinking_output_tokens: 250}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write_5m: 2.50, cache_write_1h: 4.00, cache_read: 0.10, tokenizer: 1.3, thinking_output_tokens: 250}
    gpt-6-astra: {input: 10.00, cached_input: 1.00, cache_write: 12.50, output: 50.00, thinking_output_tokens: 25}
    gpt-6.1-sol: {input: 2.00, cached_input: 0.10, cache_write: 2.50, output: 10.00, thinking_output_tokens: 25}
    gpt-6-sol: {input: 2.00, cached_input: 0.20, cache_write: 2.50, output: 10.00, thinking_output_tokens: 25}
    # Not used by default. Listed so that moving the judge is a one-line change; a newer judge's scores are not
    # comparable with a Sonnet 4.6 judge's.
    claude-sonnet-5: {input: 2.00, output: 10.00, cache_write_5m: 2.50, cache_write_1h: 4.00, cache_read: 0.20, tokenizer: 1.3, thinking_output_tokens: 250}
    claude-opus-5: {input: 5.00, output: 25.00, cache_write_5m: 6.25, cache_write_1h: 10.00, cache_read: 0.50, tokenizer: 1.3, thinking_output_tokens: 250}
    claude-haiku-4-5: {input: 1.00, output: 5.00, cache_write_5m: 1.25, cache_write_1h: 2.00, cache_read: 0.10}
    # An older OpenAI model: cached input at half price and no cache-write charge.
    gpt-4o: {input: 2.50, cached_input: 1.25, output: 10.00}
    # Read 2026-09-21 for the judge bake-off (#661), re-read 2026-10-14. gpt-5.6-luna is the sweep's judge since
    # 2026-09-22 (docs/reports/2026-09-22-rubric-test.md); the other two are priced to be callable, not endorsed.
    gpt-5.6-sol: {input: 4.00, cached_input: 0.40, cache_write: 5.00, output: 20.00}
    gpt-5.6-terra: {input: 2.00, cached_input: 0.20, cache_write: 2.50, output: 12.00}
    gpt-5.6-luna: {input: 0.20, cached_input: 0.02, cache_write: 0.25, output: 1.20}

# Before a call the meter reserves its worst case: the request's size in characters divided by this, at
# the input price (the hour cache-write price when the request carries breakpoints), plus max_tokens at the
# output price. English runs near 4 characters per token; 2.5 over-reserves on purpose, since the reservation is
# what stops a run before the cap, not after it.
chars_per_token: 2.5

# Tokens per unit of work, for the pre-run estimate that refuses to start a run over the cap. The estimate has
# to stop a run that is plainly too big; the per-call hard stop is the guard. An estimate is per unit of work,
# and a baseline question is a tool loop of several calls. Keys: input_tokens, output_tokens, and optionally
# cache_write_5m_tokens, cache_write_1h_tokens, cache_read_tokens; each is priced at the model's own rate for
# that kind of token, and the whole is scaled by the model's `tokenizer`. `calls_per_unit` (default 1) is the
# model calls one unit makes, what the model's `thinking_output_tokens` is multiplied by; from spend.json it is
# the kind's calls / units.
#
# baseline_question is MEASURED on the bounded, cached loop (#682, MAX_MODEL_CALLS = 16, five-minute
# breakpoints), from the dearest of the four cloud-subject runs of 2026-10-15: bench-20261014-2328-cuad-fable on ix,
# CUAD, the 20 keyed questions, claude-fable-5-1, 86 calls: 212 plain input, 1,349,506 cache-write (all 5m),
# 5,704,528 cache-read, 63,341 out of which 20,768 thinking. Per question, with the thinking taken out of the output
# and everything divided by Fable's tokenizer factor 1.3 so the row is in Sonnet-4.6 tokens as the `tokenizer`
# field expects: 8 / 51,904 / 219,405 / 1,637, in 4.3 calls. A frontier model reads about 50% more context per
# question than Sonnet 4.6 did on the same questions; the other three runs cost less per question (astra CUAD
# 98 calls, USD 20.66; Fable synthetic 107 calls, 20.31; astra synthetic 99 calls, 8.16), so this row is the
# ceiling. The Sonnet 4.6 measurement it replaces: bench-20260928-1050-keyed, the same 20 questions, 78 calls
# (docs/reports/2026-09-28-benchmark-ix-bench-20260928-1050-keyed.md): 118 plain input tokens, 885,157
# cache-write, 2,946,578 cache-read, 27,779 out; per question 6 / 44,258 / 147,329 / 1,389 in 3.9 calls; the
# ledger said USD 6.61 with every write priced as an hour, 4.62 at the five-minute rate the loop asked for.
# The output figure is visible answer only: a thinking model's estimate adds its thinking_output_tokens on each
# of the 4.3 calls. Until
# 2026-10-14 this was stated as 152,000 "input-token equivalents" at the plain input price, which was right
# for Sonnet 4.6 by construction and wrong for every other model: Fable 5.1, whose cache hit is 2.5% of input,
# came out at USD 30 for the 20 questions and the run was refused, when its cache-aware figure was USD 17 (the
# figure before the thinking was counted; with 1,500 of thinking a call it was 24; with the measured 250 and the
# measured volumes it is 23 for a run that cost 21.46).
# Three things about the figure:
#   - It is the keyed CUAD set: single-hop facts, dates and lists, 4.3 calls a question. The standard CUAD
#     questions (bench-20260922-2305: 63,786 write, 235,400 read, 3,017 out a question), Enron
#     (bench-20260928-2156: 62,414 / 214,615 / 2,808) and the synthetic corpus (bench-20260929-1943: 52,816 /
#     190,673 / 3,081) each cost 40 to 60% more a question. The estimate is a floor for them, not a ceiling;
#     at Fable 5.1's prices each is still one corpus under the cap (about USD 20 for 16 to 18 questions), and
#     the per-call stop is what holds the line.
#   - HOW TO CORRECT IT FROM A RUN. From the kind's row in spend.json (the report's Cloud spend table shows the
#     same row), each token column divided by `units`, never by `calls`: input_tokens, output_tokens,
#     cache_read_tokens, and cache_write_5m_tokens / cache_write_1h_tokens (the writes as the meter priced them;
#     a write the response did not break down by lifetime is under 1h); calls / units is calls_per_unit, and the
#     model's thinking_output_tokens is thinking_tokens / calls, with the thinking taken back out of output_tokens.
#     Only from a run started on or after 2026-10-14: a ledger from before the lifetime and thinking columns,
#     resumed under this code, counts only the new calls in them while its totals carry the old ones too. Not
#     "input_tokens alone": with
#     breakpoints on, the API's input_tokens is only what came after the last breakpoint, close to nothing, and
#     an estimate built from it would be the underestimate this replaced. A run on a model other than Sonnet
#     4.6 has to be divided by that model's `tokenizer` first: the figures here are Sonnet 4.6 tokens.
#   - An OpenAI model is estimated at the same volumes, its cache-read share at cached_input and its writes at
#     cache_write. Nothing OpenAI has been metered through the tool loop yet (the judge sends no cacheable
#     prefix); correct it from the first run the same way.
# candidate_answer is what answer-eval and rerun_pr_j pay a cloud model per item. It was priced as a
# baseline_question until that became CUAD's measured figure, which refused answer-eval on the synthetic corpus
# outright (29 one-hop lookups at the price of 29 contract research questions). PROVISIONAL, not metered: the
# ten CUAD ask-type questions took 6.0 model calls on average against 12.2 for the six research-type ones, and
# a synthetic lookup should need fewer still. Correct it the same way from the first metered answer-eval.
# judge is measured too, bench-20260922-2305, gpt-5.6-luna: 53 units, 2,656 in and 656 out each (the rubric of
# #695 asks for more than the Sonnet 4.6 judge's 405). USD 0.0013 a verdict.
# The rest are still PROVISIONAL, from RUNBOOK.md's old cost table.
estimates:
  synthetic_doc: {input_tokens: 600, output_tokens: 1000}
  baseline_question: {input_tokens: 8, output_tokens: 1637, cache_write_5m_tokens: 51904, cache_read_tokens: 219405, calls_per_unit: 4.3}
  candidate_answer: {input_tokens: 120000, output_tokens: 1500, calls_per_unit: 6}
  judge: {input_tokens: 3000, output_tokens: 700}
  answer_judge: {input_tokens: 3000, output_tokens: 400}
  cross_judge: {input_tokens: 3000, output_tokens: 400}
