[project]
name = "harbor-clerk-test-corpora"
version = "0.1.0"
description = "Multi-hour test sweep harness for Harbor Clerk LLM models"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "anthropic>=0.43",
    "openai>=1.50",
    # Same range as the app (root pyproject pins mcp>=1.30.0,<2).
    # The floor: below 1.30.0 the StreamableHTTP transport accumulates sessions
    # without bound (GHSA-84m7-p3x7-pcfv). uv.lock here is untracked, so the
    # floor is what forces a stale local lock off a vulnerable version.
    # The ceiling: this lock once floated to 2.0.0, where streamablehttp_client
    # is renamed streamable_http_client and no longer takes headers= or
    # timeout= — so runner/client.py raised ImportError on the first MCP call.
    # Nothing caught it because nothing ran these tests (#587). Migrating the
    # harness to the 2.x client API is worth doing, but not while it is a major
    # ahead of the server it exercises.
    "mcp>=1.30.0,<2",
    "pyyaml>=6",
    "tenacity>=9",
    "pypdfium2>=4",
    "Pillow>=13",
    "spacy>=3.7",
    "huggingface_hub>=0.25",
    "pyarrow>=21",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["../.."]
