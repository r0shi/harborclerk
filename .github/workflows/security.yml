name: Security
on:
  pull_request:
    branches: [main]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python deps
        run: uv sync --extra test

      - name: Upgrade pip in venv (CVE-2026-3219 fix in 26.1)
        run: .venv/bin/python -m pip install --upgrade 'pip>=26.1'

      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: .venv
          severity: HIGH
          # Three CVEs in smolagents 1.22.0, all in the LocalPythonExecutor
          # (its sandboxed code-exec feature) — no fix available. Vendor
          # is unresponsive per the CVE notes. We only import "from smolagents
          # import Tool" in src/harbor_clerk/llm/research_tools.py — none of
          # our code invokes the executor, so these CVEs do not apply to us.
          # Revisit whenever smolagents publishes a fix.
          #   CVE-2026-4963 — evaluate_* in local_python_executor
          #   CVE-2026-2654 — SSRF via LocalPythonExecutor.requests.get/post
          #   CVE-2025-14931 — pickle deserialization → RCE
          ignore-vulns: |
            CVE-2026-4963
            CVE-2026-2654
            CVE-2025-14931

      - name: npm audit (high/critical)
        run: cd frontend && npm ci && npm audit --audit-level=high

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -f docker/app.Dockerfile -t harborclerk-app:ci .

      - name: Build embedder image
        run: docker build -f docker/embedder.Dockerfile -t harborclerk-embedder:ci .

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Trivy scan app
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 harborclerk-app:ci

      - name: Trivy scan embedder
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 harborclerk-embedder:ci
