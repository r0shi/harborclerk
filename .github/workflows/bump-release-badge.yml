# Keeps the static "release" badge in README.md in sync with the latest
# published GitHub Release. Static badges are used (instead of shields.io's
# /github/v/release/... endpoint) because that endpoint shares an
# unauthenticated GitHub API quota and returns "invalid" under load.
#
# Triggered after a release is published on GitHub. Opens a PR rather than
# committing directly so that branch protection's required status checks
# still gate the change.

name: Bump release badge

on:
  release:
    types: [published]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update README badge
        env:
          # Bind release.tag_name into an env var first so it can never
          # be interpreted as shell. The validation regex below additionally
          # rejects anything that isn't a vX.Y.Z literal before we use it.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping: tag '$RELEASE_TAG' is not a semver release tag (vX.Y.Z)."
            exit 0
          fi
          # Match `release-vX.Y.Z-<color>` inside the badge URL and replace
          # only the version segment. Preserves the chosen badge color.
          sed -E -i "s|/badge/release-v[0-9]+\.[0-9]+\.[0-9]+-|/badge/release-${RELEASE_TAG}-|g" README.md
          if git diff --quiet README.md; then
            echo "README badge already at ${RELEASE_TAG}; nothing to do."
            exit 0
          fi
          {
            echo "BUMPED=true"
            echo "TAG=${RELEASE_TAG}"
          } >> "$GITHUB_ENV"

      - name: Open pull request
        if: env.BUMPED == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/bump-release-badge-${{ env.TAG }}
          base: main
          title: "chore(readme): bump release badge to ${{ env.TAG }}"
          body: |
            Auto-generated by `.github/workflows/bump-release-badge.yml` after
            release **${{ env.TAG }}** was published.

            The static `release-vX.Y.Z` badge in README.md is bumped to match.
            Merging triggers the normal CI checks; no manual review required
            unless something looks off.
          commit-message: |
            chore(readme): bump release badge to ${{ env.TAG }}

            Auto-generated after release ${{ env.TAG }} was published.
          delete-branch: true
