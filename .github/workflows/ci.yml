name: CI
on:
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: lka
          POSTGRES_DB: lka_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra test
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      # Generated doc blocks must match a fresh render from source. Runs before
      # the DB-backed tests so drift fails fast with a clear message; the test
      # suite also covers this (tests/test_gen_docs.py) as defence in depth.
      - name: Generated docs up to date
        run: uv run python -m scripts.gen_docs --check
      - name: Create PG extensions
        run: |
          PGPASSWORD="" psql -h localhost -U lka -d lka_test -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS citext;"
      - name: Run tests
        env:
          DATABASE_URL: "postgresql+asyncpg://lka@localhost:5432/lka_test"
          SYNC_DATABASE_URL: "postgresql://lka@localhost:5432/lka_test"
          STORAGE_BACKEND: filesystem
          STORAGE_PATH: /tmp/hc-test-storage
          TIKA_URL: "http://localhost:9998"
        run: uv run pytest tests/ -v --tb=short -m "not requires_models"

  embedder:
    # `embedder/` is a separate uv project with its own lock, and the root
    # pytest run is confined to `testpaths = ["tests"]` — so nothing here was
    # ever collected. The #553 guard (encode must not block the event loop)
    # would have been decorative on PRs without this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Lint/format are already covered: the `python` job's root `ruff check .`
      # includes embedder/. This job exists purely to collect the tests.
      - name: Run tests
        # --locked so CI cannot silently re-resolve and test a different
        # dependency set than docker/embedder.Dockerfile builds (it uses
        # `uv sync --locked`). -m matches the root job's marker handling.
        run: uv run --locked --extra test pytest tests/ -v --tb=short -m "not requires_models"
        working-directory: embedder

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - name: ESLint
        run: npm run lint
        working-directory: frontend
      - name: Prettier check
        run: npm run format:check
        working-directory: frontend
      - name: Type check
        run: npm run type-check
        working-directory: frontend
      # `frontend/package.json` has defined `"test": "vitest"` all along, but
      # nothing ran it. For the react-router v8 migration the only automated
      # signal was `tsc --noEmit`, which passes trivially on an import rename —
      # while the MemoryRouter-based route tests, the ones that would actually
      # catch a routing regression, sat uncollected.
      - name: Unit tests
        run: npm test -- --run
        working-directory: frontend
