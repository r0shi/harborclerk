    source: vendor-notes.md
    language: en
    source_kind: document
  meeting-minutes.txt:
    render: copy
    source: meeting-minutes.txt
    language: en
    source_kind: document
  meeting-minutes-v2.txt:
    render: copy
    source: meeting-minutes-v2.txt
    language: en
    source_kind: document
  bail-commercial.txt:
    render: copy
    source: bail-commercial.txt
    language: fr
    source_kind: document
  handbook.docx:
    render: docx
    source: handbook.txt
