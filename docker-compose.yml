services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - harbor-clerk

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      LLAMA_SERVER_URL: http://llama-server:8080
      MODELS_DIR: /models
      HARBOR_CLERK_MASTER_KEY: ${HARBOR_CLERK_MASTER_KEY:?master key required; see docs/secrets-and-keys.md}
      RERANKER_URL: http://reranker:8001
    volumes:
      - llama_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedder:
        condition: service_healthy
      reranker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/system/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - harbor-clerk

  worker-io:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["harbor-clerk-worker", "--queues", "io"]
    restart: unless-stopped
    env_file: .env
    environment:
      HARBOR_CLERK_MASTER_KEY: ${HARBOR_CLERK_MASTER_KEY:?master key required; see docs/secrets-and-keys.md}
      RERANKER_URL: http://reranker:8001
    depends_on:
      app:
        condition: service_healthy
    networks:
      - harbor-clerk

  worker-cpu:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["harbor-clerk-worker", "--queues", "cpu"]
    restart: unless-stopped
    env_file: .env
    environment:
      HARBOR_CLERK_MASTER_KEY: ${HARBOR_CLERK_MASTER_KEY:?master key required; see docs/secrets-and-keys.md}
      RERANKER_URL: http://reranker:8001
    depends_on:
      app:
        condition: service_healthy
      embedder:
        condition: service_healthy
    networks:
      - harbor-clerk

  # Summarize is routed to its own `llm` queue (see QUEUE_STAGES in
  # worker/entry.py). Without this service nothing claims those jobs and
  # documents silently never receive a summary. No hard dependency on
  # llama-server: summarize degrades to an extractive summary when no LLM is
  # reachable, matching how `app` treats llama-server as optional.
  worker-llm:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["harbor-clerk-worker", "--queues", "llm"]
    restart: unless-stopped
    env_file: .env
    environment:
      # Required. settings.llama_server_url defaults to localhost:8102, which is
      # the macOS-native subprocess port — inside this container that resolves to
      # nothing, and summarize would silently degrade to extractive summaries
      # after burning its retry budget. worker-io/worker-cpu don't need this
      # because no stage on those queues calls the LLM.
      LLAMA_SERVER_URL: http://llama-server:8080
      HARBOR_CLERK_MASTER_KEY: ${HARBOR_CLERK_MASTER_KEY:?master key required; see docs/secrets-and-keys.md}
      RERANKER_URL: http://reranker:8001
    depends_on:
      app:
        condition: service_healthy
    networks:
      - harbor-clerk

  watcher:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["harbor-clerk-watcher"]
    restart: unless-stopped
    env_file: .env
    environment:
      WATCH_ROOT: ${WATCH_ROOT:-/data/watch}
      HARBOR_CLERK_MASTER_KEY: ${HARBOR_CLERK_MASTER_KEY:?master key required; see docs/secrets-and-keys.md}
    volumes:
      - ./data/watch:/data/watch
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - harbor-clerk

  embedder:
    build:
      context: .
      dockerfile: docker/embedder.Dockerfile
    restart: unless-stopped
    environment:
      # Concurrent encodes. 1 keeps the single shared model serialised, which is
      # what the service is tuned for; raise only with measurements.
      EMBED_MAX_CONCURRENCY: ${EMBED_MAX_CONCURRENCY:-1}
      # e5-family models need "query: "/"passage: " prefixes; Granite-R2 does
      # not. This is the switch the rollback path depends on — it was read but
      # settable nowhere, so that path could not actually be taken.
      #
      # EMBED_MODEL is deliberately NOT set here. docker/embedder.Dockerfile
      # bakes the weights into the image and sets ENV EMBED_MODEL=/models/...
      # so the container starts without network; a compose `environment:` entry
      # overrides that ENV, which would turn the path back into a HuggingFace
      # repo id — a ~700 MB download per container recreate with no cache
      # volume, and on an air-gapped host a lifespan crash, a restart loop, and
      # `app`/`worker-cpu` never starting because they wait on this service's
      # healthcheck. Rolling back to e5 means rebuilding the image, not editing
      # compose.
      EMBED_NEEDS_PREFIX: ${EMBED_NEEDS_PREFIX:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - harbor-clerk

  reranker:
    build:
      context: .
      dockerfile: docker/reranker.Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - harbor-clerk

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harbor_clerk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harbor_clerk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-harbor_clerk}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harbor_clerk}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - harbor-clerk

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - harbor-clerk

  tika:
    image: apache/tika:latest
    restart: unless-stopped
    networks:
      - harbor-clerk

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - llama_models:/models
    command: [
      "--host", "0.0.0.0",
      "--port", "8080",
      "-ngl", "99",
      "-c", "8192",
    ]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - harbor-clerk

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
  llama_models:

networks:
  harbor-clerk:
    driver: bridge
